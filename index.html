<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Probability Revision 9.1–9.4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  --paper:#ECEEF1; --grid:#D5DBE2; --grid-strong:#BCC6D1; --margin:#E9A7A7;
  --ink:#1D2B4F; --muted:#5A6580; --accent:#2F5DA8; --accent-soft:#E3EBF8;
  --pen:#C0392B; --pen-soft:#FBEAE7; --card:#FFFFFF; --line:#C9D3E0;
  --hand:"Kalam","Comic Neue","Segoe Print",cursive;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sq:22px;
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{
  margin:0; color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.55;
  background-color:var(--paper);
  background-image:
    linear-gradient(to right, var(--grid-strong) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid-strong) 1px, transparent 1px),
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size: calc(var(--sq)*5) calc(var(--sq)*5), calc(var(--sq)*5) calc(var(--sq)*5), var(--sq) var(--sq), var(--sq) var(--sq);
  min-height:100vh;
}
.wrap{max-width:860px; margin:0 auto; padding-inline:16px; padding-block:28px 64px; position:relative}
header.top{display:flex; flex-direction:column; gap:2px; margin-bottom:22px}
.eyebrow{font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:700}
h1{font-family:var(--hand); font-weight:700; font-size:clamp(34px,6vw,48px); line-height:1.1; margin:0; text-wrap:balance}
h1 u{text-decoration-color:var(--pen); text-decoration-thickness:3px; text-underline-offset:6px}
.sub{font-family:var(--hand); font-size:clamp(20px,3.4vw,26px); color:var(--pen); line-height:1.2; margin-top:4px}
.setlabel{font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.lead{margin:6px 0 0; color:var(--muted); max-width:60ch}

/* topic chooser */
.step{font-family:var(--hand); font-size:24px; margin:18px 0 10px; display:flex; align-items:center; gap:10px}
.step b{display:inline-grid; place-items:center; width:32px; height:32px; border:2px solid var(--ink); border-radius:50%; font-size:18px}
.topics{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px}
@media (max-width:620px){.topics{grid-template-columns:1fr}}
.topic{
  all:unset; box-sizing:border-box; cursor:pointer; display:flex; gap:14px; align-items:flex-start;
  background:var(--card); border:2px solid var(--line); border-radius:6px; padding:16px 16px 14px;
  transition:border-color .15s, transform .15s, box-shadow .15s;
}
.topic:hover{border-color:var(--accent); transform:translateY(-2px); box-shadow:0 4px 0 var(--accent-soft)}
.topic:focus-visible{outline:3px solid var(--accent); outline-offset:3px}
.topic .num{font-family:var(--hand); font-weight:700; font-size:34px; line-height:1; color:var(--accent); min-width:62px}
.topic h3{margin:0 0 4px; font-size:18px; line-height:1.3}
.topic p{margin:0; font-size:14.5px; color:var(--muted)}

/* worksheet */
.sheetbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; margin-bottom:6px}
.btns{display:flex; flex-wrap:wrap; gap:8px}
button.btn{
  font:inherit; font-size:15px; font-weight:700; cursor:pointer; border-radius:6px; padding:8px 14px;
  border:2px solid var(--ink); background:var(--card); color:var(--ink);
}
button.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--paper)}
button.btn:hover{filter:brightness(1.05)}
button.btn:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.sheet-title{font-family:var(--hand); font-size:clamp(26px,4.5vw,34px); font-weight:700; margin:10px 0 2px; line-height:1.2; text-wrap:balance}
.sheet-title span{color:var(--accent)}
.note{
  display:flex; gap:10px; align-items:flex-start; background:var(--card); border:2px dashed var(--line);
  border-radius:6px; padding:10px 14px; margin:10px 0 18px; font-size:15px;
}
.note .pencil{font-family:var(--hand); font-weight:700; color:var(--pen); white-space:nowrap}
.q{
  background:var(--card); border:1.5px solid var(--line); border-radius:6px;
  padding:16px 18px 14px 18px; margin-bottom:16px; position:relative;
  border-left:5px solid var(--margin);
}
.qhead{display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; margin-bottom:8px}
.qnum{font-family:var(--hand); font-weight:700; font-size:26px; line-height:1}
.level{display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.dots{display:inline-flex; gap:3px}
.dots i{width:9px; height:9px; border-radius:50%; border:1.5px solid var(--accent)}
.dots i.on{background:var(--accent)}
.stem p{margin:0 0 8px; max-width:68ch}
.parts{list-style:none; margin:6px 0 0; padding:0; display:grid; gap:8px}
.parts li{display:grid; grid-template-columns:34px 1fr; gap:4px; align-items:baseline}
.parts li.solo{grid-template-columns:1fr}
.parts li.solo .pl{display:none}
.mc{display:flex; flex-wrap:wrap; gap:6px 22px; margin-top:6px; font-variant-numeric:tabular-nums}
svg.spin{max-width:170px}
.parts .pl{font-weight:700; color:var(--muted)}
.ans{
  grid-column:2; margin-top:4px; padding:6px 10px; border-radius:4px;
  background:var(--pen-soft); color:var(--pen); font-family:var(--hand); font-size:19px; line-height:1.5;
}
.ans .w{display:block; font-family:var(--body); font-size:14px; color:var(--ink); opacity:.85}
.qfoot{display:flex; justify-content:flex-end; margin-top:10px}
button.reveal{
  font:inherit; font-size:14px; font-weight:700; cursor:pointer; border:0; background:none; color:var(--pen);
  padding:4px 2px; border-bottom:2px solid currentColor;
}
button.reveal:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

/* maths bits */
.fr{display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; line-height:1.1; margin:0 2px; font-variant-numeric:tabular-nums}
.fr > span:first-child{border-bottom:1.5px solid currentColor; padding:0 3px}
.fr > span:last-child{padding:0 3px}
.tblwrap{overflow-x:auto; margin:6px 0 10px}
table.tw{border-collapse:collapse; font-variant-numeric:tabular-nums; background:var(--card)}
table.tw th, table.tw td{border:1.5px solid var(--ink); padding:5px 12px; text-align:center; font-size:15px}
table.tw th{font-weight:700}
table.tw td.blank{min-width:56px}
table.tw td.blank::after{content:""; display:inline-block; width:40px; height:20px; border:1.5px dashed var(--muted); border-radius:3px; vertical-align:middle}
.digits{font-family:ui-monospace,"SFMono-Regular",Menlo,monospace; letter-spacing:.25em; font-size:17px; background:var(--card); padding:6px 10px; border:1.5px solid var(--line); border-radius:4px; display:inline-block; margin:2px 0 8px; word-break:break-all}
.numgrid{display:inline-grid; grid-template-columns:repeat(4,auto); gap:2px 22px; font-variant-numeric:tabular-nums; margin:2px 0 10px 8px}
svg.venn{max-width:100%; height:auto; display:block; margin:6px 0 10px}
svg.venn text{fill:var(--ink); font-family:var(--body)}
svg.venn .shape{fill:none; stroke:var(--ink); stroke-width:1.8}
kbd{font-family:inherit; font-weight:700}

.foot{margin-top:26px; font-size:13px; color:var(--muted)}
@media (prefers-reduced-motion:reduce){ .topic{transition:none} .topic:hover{transform:none} }
@media (max-width:480px){ body{font-size:16px} .q{padding:14px 14px 12px} .parts li{grid-template-columns:28px 1fr} }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="eyebrow">Year 9 Advanced · Unit 9</div>
    <h1><u>Probability</u> revision</h1>
    <div class="sub">Practice for Term 4 Assessment Task</div>
    <p class="lead">Pick a topic to get every practice question for it, from easy to hard. Write the heading, the question number and your working in your book.</p>
  </header>

  <section id="chooser">
    <div class="step"><b>1</b> Choose your topic</div>
    <div class="topics" id="topics"></div>
  </section>

  <section id="sheet" hidden>
    <div class="sheetbar">
      <div class="step" style="margin:0"><b>2</b> Write it down</div>
      <div class="btns">
        <button class="btn" id="back" type="button">← Change topic</button>
      </div>
    </div>
    <div class="sheet-title" id="sheetTitle"></div>
    <div class="note"><span class="pencil">In your book:</span><span id="noteText"></span></div>
    <div id="questions"></div>
    <div class="btns" style="justify-content:flex-end">
      <button class="btn" id="back2" type="button">← Change topic</button>
    </div>
  </section>

</div>

<script>
/* ---------- helpers ---------- */
let rnd=Math.random;
const seeded=seed=>()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const R=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const pick=a=>a[Math.floor(rnd()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const frHTML=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
function F(n,d){ if(n===0) return '0'; const g=gcd(n,d); n/=g; d/=g; return d===1?String(n):frHTML(n,d); }
const Fr=(n,d)=>frHTML(n,d);                       // unsimplified, for working
const pct=(x,dp)=>{const v=Math.round(x*Math.pow(10,dp+2)+1e-7)/Math.pow(10,dp);return v.toFixed(dp)+'%'};
const pctN=x=>(Math.round(x*10000+1e-7)/100)+'%';       // up to 2 dp, trimmed
const dec2=p=>(p/100).toFixed(2);
const P=(q,a,w)=>({q,a,w});
const range=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const dice=()=>{const o=[];for(let i=1;i<=6;i++)for(let j=1;j<=6;j++)o.push([i,j]);return o};
const isPrime=n=>{if(n<2)return false;for(let i=2;i*i<=n;i++)if(n%i===0)return false;return true};
const table=(head,rows)=>`<div class="tblwrap"><table class="tw"><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map((c,i)=>c==='?'?'<td class="blank"></td>':(i===0?`<th>${c}</th>`:`<td>${c}</td>`)).join('')}</tr>`).join('')}</table></div>`;
function venn(A,B,a,both,b,n){
  return `<svg class="venn" viewBox="0 0 320 180" width="320" role="img" aria-label="Venn diagram: ${A} only ${a}, both ${both}, ${B} only ${b}, neither ${n}">
  <rect class="shape" x="4" y="4" width="312" height="172" rx="4"/>
  <circle class="shape" cx="125" cy="92" r="62"/><circle class="shape" cx="195" cy="92" r="62"/>
  <text x="100" y="23" font-size="13" text-anchor="middle">${A}</text><text x="220" y="23" font-size="13" text-anchor="middle">${B}</text>
  <text x="100" y="100" font-size="20" text-anchor="middle" font-weight="700">${a}</text>
  <text x="160" y="100" font-size="20" text-anchor="middle" font-weight="700">${both}</text>
  <text x="220" y="100" font-size="20" text-anchor="middle" font-weight="700">${b}</text>
  <text x="22" y="164" font-size="18" text-anchor="middle" font-weight="700">${n}</text></svg>`;
}

const ctx2=[['Athletics','Swimming'],['Cricket','Football'],['Walking','Jogging'],['Dog','Cat'],['Music','Drama'],['Netball','Soccer']];
function mkTable(){let c11,c12,c21,c22;do{c11=R(10,35);c12=R(8,35);c21=R(8,30);c22=100-c11-c12-c21}while(c22<5||c22>40);return{c11,c12,c21,c22}}
/* ---------- shared question builders ---------- */
const Q=(lvl,fn)=>{fn.lvl=lvl;return fn};
const one=(q,a,w,stem='')=>({stem,parts:[P(q,a,w)]});
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const plural=(n,s,pl)=>n===1?s:(pl||s+'s');
const SPIN={R:['red','#F28B82'],B:['blue','#8AB4F8'],Y:['yellow','#FDE68A'],G:['green','#81C995']};
function spinnerSVG(secs,colored){
  const n=secs.length,r=70,cx=80,cy=80;let s=`<svg class="venn spin" viewBox="0 0 160 160" width="170" role="img" aria-label="Spinner with ${n} equal sectors: ${secs.map(x=>colored?SPIN[x][0]:x).join(', ')}">`;
  for(let i=0;i<n;i++){const a0=(-90+i*360/n)*Math.PI/180,a1=(-90+(i+1)*360/n)*Math.PI/180,am=(a0+a1)/2;
    const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    s+=`<path d="M${cx} ${cy} L${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z" fill="${colored?SPIN[secs[i]][1]:'#FFFFFF'}" stroke="#1D2B4F" stroke-width="1.5"/>`;
    s+=`<text x="${(cx+r*.64*Math.cos(am)).toFixed(1)}" y="${(cy+r*.64*Math.sin(am)+6).toFixed(1)}" font-size="17" font-weight="700" text-anchor="middle" style="fill:#1D2B4F">${secs[i]}</text>`}
  return s+`<circle cx="${cx}" cy="${cy}" r="4" fill="#1D2B4F"/></svg>`;
}
const mc=opts=>`<span class="mc">${opts.map(o=>`<span>○ ${o}</span>`).join('   ')}</span>`;
const dec=(x,dp=2)=>x.toFixed(dp);
function evPct(x){return pctN(x)}

/* ---------- 9.1 Theoretical probability (mirrors MathsOnline "Theoretical probability" Q1–Q40) ---------- */
let bagDie=[],bagTwo=[],bagFour=[],bagFruit=[];
const twoItems=[['a jar','jelly beans',['red','black']],['a tin','biscuits',['chocolate','plain']],['a box','pens',['blue','green']],['a pencil case','pencils',['HB','coloured']],['a bowl','lollies',['strawberry','lime']]];
const fruitBags=[['a fruit bowl','green pears','yellow pears'],['a basket','red apples','green apples'],['a crate','oranges','mandarins']];
const fourSets=[
 {intro:(c,n)=>`A drawer has ${c[0]} white, ${c[1]} black, ${c[2]} gold and ${c[3]} silver hair ties. Priya takes one without looking.`,names:['white','black','gold','silver'],noun:'hair tie'},
 {intro:c=>`A bag of lollies has ${c[0]} raspberry, ${c[1]} grape, ${c[2]} lemon and ${c[3]} cola flavoured lollies. Tom takes one at random.`,names:['raspberry','grape','lemon','cola'],noun:'lolly'},
 {intro:c=>`A class library shelf holds ${c[0]} mystery, ${c[1]} fantasy, ${c[2]} sport and ${c[3]} history books. Ava picks one book at random.`,names:['mystery','fantasy','sport','history'],noun:'book'},
 {intro:c=>`A bag contains ${c[0]} orange, ${c[1]} pink, ${c[2]} blue and ${c[3]} clear marbles. Leo takes one marble at random.`,names:['orange','pink','blue','clear'],noun:'marble'},
 {intro:c=>`In a class, ${c[0]} students walk, ${c[1]} ride a bike, ${c[2]} catch the train and ${c[3]} are driven to school. One student is chosen at random.`,names:['walks','rides a bike','catches the train','is driven'],noun:'student',people:true},
 {intro:c=>`A laundry basket has ${c[0]} white, ${c[1]} navy, ${c[2]} red and ${c[3]} spotted socks. One sock is pulled out at random.`,names:['white','navy','red','spotted'],noun:'sock'},
 {intro:c=>`A school car park has ${c[0]} white, ${c[1]} grey, ${c[2]} blue and ${c[3]} red cars. One car is chosen at random.`,names:['white','grey','blue','red'],noun:'car'}
];
function fourCat(){const s=bagFour.pop();const c=[R(3,12),R(3,12),R(2,8),R(1,6)];const T=c[0]+c[1]+c[2]+c[3];const nm=s.names;
  const an=w=>/^[aeiou]/.test(w)?'an':'a';const lab=i=>s.people?`the student ${nm[i]}`:`${an(nm[i])} ${nm[i]} ${s.noun}`;const notLab=i=>s.people?`the student does not ${nm[i].replace(/^walks$/,'walk').replace('rides','ride').replace('catches','catch').replace('is driven','get driven')}`:`not ${an(nm[i])} ${nm[i]} ${s.noun}`;
  return{stem:`<p>${s.intro(c)} There are ${T} altogether.</p><p>Find the probability that${s.people?'':' it is'}:</p>`,
  parts:[P(lab(0),F(c[0],T),`${c[0]} out of ${T}`),P(lab(2),F(c[2],T),`${c[2]} out of ${T}`),P(`${lab(1)} or ${s.people?'the student '+nm[3]:an(nm[3])+' '+nm[3]+' '+s.noun}`,F(c[1]+c[3],T),`${c[1]} + ${c[3]} = ${c[1]+c[3]}`),P(notLab(0),F(T-c[0],T),`${T} − ${c[0]} = ${T-c[0]}`),P(notLab(3),F(T-c[3],T),`${T} − ${c[3]} = ${T-c[3]}`)]}}
function colourSpinner(n,notTwo){let secs;const cols=shuffle(['R','B','Y','G']).slice(0,n>=6?4:3);do{secs=Array.from({length:n},(_,i)=>i<cols.length?cols[i]:pick(cols));secs=shuffle(secs)}while(new Set(secs).size<cols.length);
  const cnt=c=>secs.filter(x=>x===c).length;const [x,y,z]=shuffle(cols);const nm=c=>SPIN[c][0];
  const third=notTwo?P(`does not land on either ${nm(x)} or ${nm(y)}`,F(n-cnt(x)-cnt(y),n),`${n} − ${cnt(x)} − ${cnt(y)} = ${n-cnt(x)-cnt(y)} sectors`):P(`does not land on ${nm(z)}`,F(n-cnt(z),n),`${n} − ${cnt(z)} = ${n-cnt(z)} sectors`);
  return{stem:`<p>The spinner has ${n} equal sectors (R = red, B = blue, Y = yellow, G = green). It is spun once.</p>${spinnerSVG(secs,true)}<p>Find the probability that the spinner:</p>`,
   parts:[P(`lands on ${nm(x)}`,F(cnt(x),n),`${cnt(x)} of ${n} sectors`),P(`lands on ${nm(x)} or ${nm(y)}`,F(cnt(x)+cnt(y),n),`${cnt(x)} + ${cnt(y)} = ${cnt(x)+cnt(y)} sectors`),third]}}
function numSpinner(n,maxv,distinct){let secs=distinct?shuffle(range(1,n)):Array.from({length:n},()=>R(1,maxv));const k1=R(3,maxv-1),k2=R(2,maxv-1);const oddQ=rnd()<.5;
  const c=f=>secs.filter(f).length;const par=oddQ?P('lands on an odd number',F(c(x=>x%2),n),`odd sectors: ${c(x=>x%2)}`):P('lands on an even number',F(c(x=>x%2===0),n),`even sectors: ${c(x=>x%2===0)}`);
  return{stem:`<p>The spinner has ${n} equal sectors and is spun once.</p>${spinnerSVG(secs,false)}<p>Find the probability that the spinner:</p>`,
   parts:[par,P(`lands on a number less than ${k1}`,F(c(x=>x<k1),n),`${c(x=>x<k1)} sectors`),P(`lands on ${k2} or more`,F(c(x=>x>=k2),n),`${c(x=>x>=k2)} sectors`)]}}
const T1=[
 Q(0,()=>{bagDie=shuffle(range(1,6));bagTwo=shuffle(twoItems);bagFour=shuffle(fourSets);bagFruit=shuffle(fruitBags);return one('A fair coin is flipped once. Find the probability that it lands on tails.',F(1,2),'2 equally likely outcomes, 1 is tails')}),
 Q(0,()=>{const n=R(3,6);return one(`A quiz show contestant picks one of ${n} closed boxes. Only one box holds the prize. What is the chance the contestant wins the prize?`,F(1,n),`1 winning box out of ${n}`)}),
 ...[0,1,2].map(()=>Q(0,()=>{const k=bagDie.pop();return one(`A fair six-sided die is rolled. Find the probability of rolling a ${k}.`,F(1,6),'1 favourable outcome out of 6')})),
 Q(0,()=>one('A fair coin is flipped once. Find the probability that it lands on heads.',F(1,2),'2 equally likely outcomes, 1 is heads')),
 ...[0,1,2].map(()=>Q(0,()=>{const k=bagDie.pop();return one(`A standard die is rolled once. Find the probability that it shows ${k}.`,F(1,6),'1 favourable outcome out of 6')})),
 Q(0,()=>{const n=R(4,10),k=R(1,n);return one(`A spinner has ${n} equal sections numbered 1 to ${n}. Find the probability of spinning a ${k}.`,F(1,n),`1 section out of ${n}`)}),
 Q(0,()=>{const n=R(5,9),g=R(2,n-2);return one(`${n} students are nominated for SRC captain. ${g} of them are girls. One student is chosen at random. What is the probability that a boy is chosen?`,F(n-g,n),`${n} − ${g} = ${n-g} boys`)}),
 Q(0,()=>{const [ctr,a,b]=bagFruit.pop();const x=R(2,7),y=R(2,7);return one(`${cap(ctr)} holds ${x} ${a} and ${y} ${b}. One piece of fruit is picked at random. What is the probability it is one of the ${b}?`,F(y,x+y),`${y} out of ${x+y}`)}),
 Q(0,()=>{const [a,b]=shuffle(range(1,6)).slice(0,2).sort();return one(`A standard six-sided die is rolled. Find the probability that it lands on ${a} or ${b}.`,F(2,6),'2 favourable outcomes out of 6')}),
